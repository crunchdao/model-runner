version: '3.8'

services:
  model-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.generic
    ports:
      - "50051:50051"
    volumes:
      # Mount user submission code
      - ./submission/code:/workspace/submission/code:ro
      # Mount resources (can be read-write if needed)
      - ./resources:/workspace/resources:ro
      # Mount cache directory to persist installed requirements
      - model_runner_cache:/workspace/cache
    environment:
      # Override default configuration
      - HAS_GPU=false
      - LOG_LEVEL=INFO
      - SERVER_ADDRESS=[::]:50051
    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # Example with GPU support
  model-runner-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.generic
    ports:
      - "50052:50051"
    volumes:
      - ./submission/code:/workspace/submission/code:ro
      - ./resources:/workspace/resources:ro
      - model_runner_cache_gpu:/workspace/cache
    environment:
      - HAS_GPU=true
      - LOG_LEVEL=DEBUG
      - SERVER_ADDRESS=[::]:50051
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  model_runner_cache:
  model_runner_cache_gpu: